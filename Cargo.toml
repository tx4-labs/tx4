[workspace]
resolver = "2"
members = [
    "crates/tx4-domain",
    "crates/tx4-application",
    "crates/tx4-persistence",
    "crates/tx4-api",
    "crates/tx4-adapters-payment",
    "crates/tx4-worker",
    "crates/tx4-observability",
    "crates/tx4-config",
    "apps/tx4-server",
    "apps/tx4-worker",
    "apps/tx4-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tx4-domain = { path = "crates/tx4-domain" }
tx4-application = { path = "crates/tx4-application" }
tx4-persistence = { path = "crates/tx4-persistence" }
tx4-api = { path = "crates/tx4-api" }
tx4-adapters-payment = { path = "crates/tx4-adapters-payment" }
tx4-worker = { path = "crates/tx4-worker" }
tx4-observability = { path = "crates/tx4-observability" }
tx4-config = { path = "crates/tx4-config" }
serde = { version = "1.0.219", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
